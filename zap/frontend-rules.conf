# Reglas de OWASP ZAP para el Frontend (Next.js).
# Formato: <id de regla>  <IGNORE|MEDIUM|LOW>  <comentario>

# --- IGNORE: Tecnologías que NO usamos ---
40028  IGNORE  ELMAH (ASP.NET)
40029  IGNORE  Trace.axd (ASP.NET)
40032  IGNORE  .htaccess (Apache)
40042  IGNORE  Spring Actuator (Java)
40043  IGNORE  Log4Shell (Java)
40045  IGNORE  Spring4Shell (Java)

# --- IGNORE: Headers que no vas a arreglar ahora ---
10020  IGNORE  Missing Anti-clickjacking Header (Next.js lo maneja vía CSP)
10021  IGNORE  X-Content-Type-Options Header Missing (pendiente en next.config)
10035  IGNORE  Strict-Transport-Security Header Not Set (pendiente en next.config/proxy)
10038  IGNORE  Content Security Policy (CSP) Header Not Set (se valida aparte)
10063  IGNORE  Permissions Policy Header Not Set

# --- IGNORE: Ruido específico de Next.js / falsos positivos ---
10044  IGNORE  Big Redirect Detected (falso positivo común)
10202  IGNORE  Absence of Anti-CSRF Tokens (Server Actions)
20012  IGNORE  Anti-CSRF Tokens Check
30003  IGNORE  Integer Overflow Error (falso positivo en /login)
40025  IGNORE  Proxy Disclosure (entorno con CDN/Proxy)
40033  IGNORE  NoSQL Injection (usamos Postgres)
43     IGNORE  Source Code Disclosure - File Inclusion (falso positivo en _next/image)
90004  IGNORE  Cross-Origin-Resource-Policy Header Missing

# --- MEDIUM: Bajar fuerza de inyecciones costosas ---
40012  MEDIUM  Cross Site Scripting (Reflected)
40018  MEDIUM  SQL Injection
40026  MEDIUM  Cross Site Scripting (DOM Based)